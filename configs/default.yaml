# ===========================================================================
# 抗干扰语音指令识别流水线 - 配置文件 V3
# 项目: XH-202615 复杂交互场景的抗干扰语音指令识别技术
# ===========================================================================

# 音频参数 (datasetA 统一格式)
audio:
  sample_rate: 16000          # 采样率 16kHz
  mono: true                  # 单声道
  sample_width: 2             # 16-bit PCM
  format: wav

# ===========================================================================
# Stage 1: 降噪模型
# ===========================================================================
denoise:
  # 主选: GTCRN — 48K参数深度学习降噪, 复数域mask, 实时推理
  # 备选: noisereduce   — 纯Python频谱门限, 适合快速验证
  #       DeepFilterNet3 — 轻量实时, 需Rust编译
  #       FullSubNet+    — 降噪质量更高但更重
  model: gtcrn
  gtcrn:
    checkpoint: dns3           # dns3 (通用噪声) 或 vctk (人声)
    n_fft: 512                 # STFT 帧长
    hop_length: 256            # STFT 帧移
  noisereduce:
    stationary: true            # 静态噪声假设 (适合空调等持续噪声)
    prop_decrease: 0.8          # 噪声抑制比例 (0-1, 越大抑制越多)
  deepfilternet3:
    # 预训练权重自动从 HuggingFace 下载
    model_dir: null           # null = 自动下载, 或指定本地路径
    atten_lim_db: 6           # 最大衰减 dB
  fullsubnet_plus:
    checkpoint: null           # 指定本地 checkpoint 路径
  enable: true                 # 是否启用降噪阶段

# ===========================================================================
# Stage 2: 人声分离 / 目标说话人提取
# ===========================================================================
separation:
  # 最终选择：SpEx+ 16kHz目标说话人提取模型。
  # 每条样本以对应的唤醒音频作为目标说话人参考。
  model: spex_plus
  sepformer16k:
    # SpeechBrain 预训练模型, 2-speaker separation at 16kHz
    huggingface_repo: speechbrain/sepformer-whamr16k
    # WHAMR 数据集: WSJ0-Mix + 噪声 + 混响, 16kHz
    # SI-SNRi: 13.5 dB, SDRi: 13.0 dB
  sepformer:
    # 8kHz 版本 (已弃用, 降采样导致音质降级)
    huggingface_repo: speechbrain/sepformer-libri2mix
    sample_rate: 8000          # 原生 8kHz, 需重采样
  spex_plus:
    checkpoint: pretrained/spex_plus/checkpoint.pth
    sample_rate: 16000
    num_spks: 90
    expected_sha256: 2d6a2f2b404fd18a809eb82052fd64ef0bd986f410b1043bc666b54121e44b5c
    # 权重缺失或校验失败时直接停止，禁止静默退化为直通模式。
    allow_fallback: false
  # 与本次datasetA正式记录完全一致的阈值。
  enable: true
  max_speakers: 2              # 比赛说明: 同一时间最多2个说话人
  vp_threshold_separated: 0.35
  sep_trigger_min: 0.0
  sim_jump_cap: 1.0
  # 以下两个开关在自适应模式下忽略 (保留供非自适应实验):
  voiceprint_use_separated: false # (自适应模式下忽略)
  asr_use_separated: true         # (自适应模式下忽略)

# ===========================================================================
# Stage 3: 声纹鉴别
# ===========================================================================
voiceprint:
  # 主选: CAM++ (3DSpeaker/ModelScope) — 阿里开源, 中文场景优化, 国内下载稳定
  # 备选: ECAPA-TDNN (SpeechBrain)   — VoxCeleb预训练, 需HuggingFace
  #       WeSpeaker                    — Wenet 团队, 轻量高效
  model: cam_plus
  ecapa_tdnn:
    huggingface_repo: speechbrain/spkrec-ecapa-voxceleb
    embedding_dim: 192
  cam_plus:
    # 3DSpeaker 框架, 需安装 modelscope
    model_id: iic/speech_campplus_sv_zh-cn_16k-common
    embedding_dim: 192
    # 当前为全预训练状态: finetuned_path=null 加载官方预训练权重
    # (微调产物不入库, 最后阶段微调后再启用此字段)
    finetuned_path: null
  wespeaker:
    checkpoint: null
  # 鉴别阈值: cosine similarity 低于此值则拒识
  # 预训练模型最优阈值 0.25 (实测); 微调后需重新扫描
  threshold: 0.25
  enable: true

# ===========================================================================
# Stage 4: 语音识别 (ASR)
# ===========================================================================
asr:
  # 主选: Paraformer (FunASR) — 中文识别 SOTA, 支持热词
  # 备选: SenseVoice (ModelScope/iic) — 与 CAM++ 同属 iic 生态, 非自回归极速推理
  #       Whisper (small/base)        — 多语言, 鲁棒性好但较慢
  #       SherpaONNX                  — ONNX 推理, 极轻量
  model: paraformer
  sensevoice:
    # ModelScope iic 模型, 与 CAM++ 同生态 (iic/speech_campplus_sv_zh-cn_16k-common)
    # 非自回归端到端, 10秒音频70ms推理, 15x实时速度
    # 支持语音识别 + 语种识别 + 情感识别 + 声学事件检测
    model_id: iic/SenseVoiceSmall
    vad_model: fsmn-vad
    language: zh
    # 逆文本正则化: false=保留中文数字格式(二十五), true=转阿拉伯数字(25)
    # 标签用中文数字 → 设 false 匹配标签格式, 降低 CER
    use_itn: false
  paraformer:
    # FunASR AutoModel 自动下载
    model_name: paraformer-zh
    vad_model: fsmn-vad
    punc_model: ct-punc
    hotwords: "空调,洗碗机,灯光,风量,制热,暂停,音量"  # 领域热词
  whisper:
    model_size: base           # tiny/base/small
    language: zh
  sherpa_onnx:
    encoder: null
    decoder: null
  enable: true

# ===========================================================================
# 数据集路径
# ===========================================================================
dataset:
  pos_jsonl: "pos.jsonl"
  neg_jsonl: "neg.jsonl"
  pos_dir: "pos"
  neg_dir: "neg"

# ===========================================================================
# 输出配置
# ===========================================================================
output:
  result_dir: "results/spex_plus"
  save_intermediate: false     # 保存中间音频 (降噪后, 分离后) - 关闭以加速
  intermediate_dir: "results/spex_plus/intermediate"

# ===========================================================================
# 推理设备
# ===========================================================================
# FAQ#6: 最终测试使用统一GPU环境 (L20-46G显卡)
# 本地开发: cpu (CUDA版torch未安装)
# 提交官方: cuda (L20-46G GPU环境)
# 设为 auto 则自动检测: 有CUDA用CUDA, 无则用CPU
device: auto
