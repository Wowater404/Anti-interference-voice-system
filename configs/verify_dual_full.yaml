audio:
  sample_rate: 16000
  mono: true
  sample_width: 2
  format: wav
denoise:
  # [2026-08-16 11:40] V16: DeepFilterNet3 微调权重 (LibriSpeech clean + DEMAND 噪声, 3 epoch)。
  # 实测: 预训练 SI-SDR +8.0dB → 微调 +14.9dB (SNR 5dB 场景), 已部署为默认。
  model: deepfilternet3
  enable: true
  deepfilternet3:
    model_dir: pretrained/deepfilternet3_finetuned
    atten_lim_db: 4
    post_filter: false
  renoise:
    stationary: false
    prop_decrease: 0.9
    n_std_thresh: 1.0
    n_fft: 1024
  gtcrn:
    checkpoint: dns3
    n_fft: 512
    hop_length: 256
separation:
  model: spex_plus
  sepformer16k:
    huggingface_repo: speechbrain/sepformer-whamr16k
  sepformer:
    huggingface_repo: speechbrain/sepformer-libri2mix
    sample_rate: 8000
  spex_plus:
    checkpoint: pretrained/spex_plus/checkpoint.pth
    sample_rate: 16000
    num_spks: 90
    expected_sha256: 2d6a2f2b404fd18a809eb82052fd64ef0bd986f410b1043bc666b54121e44b5c
    allow_fallback: false
  enable: true
  max_speakers: 2
  vp_threshold_separated: 0.2805
  sep_trigger_min: 0.0
  sim_jump_cap: 0.3
  voiceprint_use_separated: false
  asr_use_separated: true
  # V9: kws 自适应盲分离
  kws_enable: true             # 是否对 kws 做降噪+自适应盲分离
  kws_trigger_sim: 0.5         # 降噪后唤醒词 ASR 匹配度低于此值才触发盲分离
  # [2026-08-15] 能量法预检: 盲分离两轨能量比 < 此值判单人 (伪影轨), 跳过各轨匹配省时
  # 实测: 真多人重叠 ratio 最低 0.37, 单人伪影通常 < 0.3
  kws_sep_energy_th: 0.3
  # [2026-08-17] V17.1 省时优化 (冒烟 95% 一致, 全量 91.19%)
  kws_early_stop: true         # 语言早停: 纯英文词英文先跑命中即停, 含中文词中文先跑; 未命中补跑另一语言
  kws_energy_gate: true        # 能量法保守版: 判单人→先降噪整体匹配命中即停, 未命中再各轨 (保留全部路径)
  kws_para_quick: true         # 中文 Paraformer 快筛(0.26s)命中即停, 未命中 Nano 复核; 双 ASR 并集命中率更高且省 46% 时间
voiceprint:
  model: ensemble
  ensemble:
    weights:
    - 0.4
    - 0.4
    - 0.2
    threshold: -0.17
  ecapa_tdnn:
    huggingface_repo: speechbrain/spkrec-ecapa-voxceleb
    embedding_dim: 192
  cam_plus:
    model_id: iic/speech_campplus_sv_zh-cn_16k-common
    embedding_dim: 192
    finetuned_path: runs/camplus_v8_full/camplus_finetuned_best.pt
  eres2netv2:
    model_id: iic/speech_eres2netv2_sv_zh-cn_16k-common
    embedding_dim: 192
    finetuned_path: runs/eres2netv2_v8_full/camplus_finetuned_best.pt
  resnetse:
    model_path: pretrained/wespeaker_resnet34/wespeaker_zh_cnceleb_resnet34.onnx
    num_threads: 4
    embedding_dim: 256
  threshold: 0.68
  enable: true
asr:
  # [2026-08-15 21:20] V13: 指令识别换回 Nano。
  # 全量实测 Paraformer CER 0.53 (短指令非自回归长度预测缺陷, 53%指令≤6字全踩雷)
  # vs Nano 0.37。比赛 CER 权重 40%, 速度换精度不划算。
  # kws 中文快匹配仍用 Paraformer (kws_asr), 英文匹配用 Nano (asr)。
  model: fun_asr_nano
  fun_asr_nano:
    model_dir: FunAudioLLM/Fun-ASR-Nano-2512
    language: 中文
    hotwords: null
    device: cuda:0
  sensevoice:
    model_id: iic/SenseVoiceSmall
    vad_model: fsmn-vad
    language: zh
    use_itn: false
  paraformer:
    model_name: paraformer-zh
    vad_model: fsmn-vad
    punc_model: null
    hotwords: 空调,洗碗机,灯光,风量,制热,暂停,音量
  # [2026-08-15 21:20] kws 中文快匹配专用 ASR (Paraformer):
  # 中文快匹配 0.26s (命中~65% 走快路径), 未命中盲分离各轨也用 Paraformer;
  # 英文唤醒词用主 asr (Nano 英文模式)。
  kws_asr:
    enable: true
    model: paraformer
    model_name: paraformer-zh
    vad_model: fsmn-vad
    punc_model: null
    hotwords: null
  whisper:
    model_size: base
    language: zh
  sherpa_onnx:
    encoder: null
    decoder: null
  enable: true
dataset:
  pos_jsonl: pos.jsonl
  neg_jsonl: neg.jsonl
  pos_dir: pos
  neg_dir: neg
output:
  result_dir: results/spex_plus
  save_intermediate: false
  intermediate_dir: results/spex_plus/intermediate
device: auto
